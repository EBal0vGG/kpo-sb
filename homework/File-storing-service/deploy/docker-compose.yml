version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: quay.io/minio/minio:RELEASE.2024-04-18T19-09-19Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  gateway:
    build:
      context: ..
      dockerfile: deploy/gateway.Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      HTTP_MAX_BODY_BYTES: "20971520"
      POSTGRES_URL: postgres://postgres:postgres@postgres:5432/gateway?sslmode=disable
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: gateway
    depends_on:
      - postgres
      - minio
    ports:
      - "8080:8080"

  file-store:
    build:
      context: ..
      dockerfile: deploy/file-store.Dockerfile
    environment:
      HTTP_ADDR: ":8081"
      HTTP_MAX_BODY_BYTES: "20971520"
      POSTGRES_URL: postgres://postgres:postgres@postgres:5432/file_store?sslmode=disable
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: file-store
    depends_on:
      - postgres
      - minio
    ports:
      - "8081:8081"

  file-analysis:
    build:
      context: ..
      dockerfile: deploy/file-analysis.Dockerfile
    environment:
      HTTP_ADDR: ":8082"
      HTTP_MAX_BODY_BYTES: "20971520"
      POSTGRES_URL: postgres://postgres:postgres@postgres:5432/file_analysis?sslmode=disable
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: file-analysis
      PLAGIARISM_THRESHOLD: "0.7"
      STORE_SERVICE_URL: "http://file-store:8081"
    depends_on:
      - postgres
      - minio
    ports:
      - "8082:8082"

volumes:
  postgres_data:
  minio_data:


